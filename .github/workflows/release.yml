# Render → QC → package → GitHub Release, all in ONE run (GITHUB_TOKEN pushes do not trigger other workflows — ADR-004).
# Triggers: a push that adds/changes `release-requests/<ep>.request` (see release-requests/README.md); a push touching only this
# workflow file runs the 3-second smoke test. Tag pushes are refused by the Claude environment's git proxy and workflow_dispatch needs a
# default branch, so neither is used (ADR-004 amended 2026-10-03).
# Free standard runner only (ADR-003). Runner setup is explicit — nothing from the Claude environment is assumed (ADR-005).
name: build-and-release
# PROJECT CLOSED / DISCONTINUED BY USER (2026-10-04): automatic trigger removed. Pushes no longer start this workflow.
# Manual dispatch left in place only so the definition stays runnable for archival inspection; do not run it.
on:
  workflow_dispatch:
    inputs:
      episode: { description: "episode id (e.g. ep-001) or 'smoke'", required: true, default: "smoke" }
      format: { description: "long | short | both", required: false, default: "long" }
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # only this job creates the release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Resolve targets (every request file changed in this push, else smoke)
        id: t
        run: |
          EP="${{ github.event.inputs.episode }}"; FMT="${{ github.event.inputs.format }}"; [ -z "$FMT" ] && FMT=long
          TARGETS=""
          if [ -n "$EP" ]; then TARGETS="$EP:$FMT"; else
            for REQ in $(git diff --name-only HEAD~1 HEAD -- 'release-requests/*.request' 2>/dev/null); do
              [ -f "$REQ" ] || continue
              E=$(sed -n 's/^episode:[[:space:]]*//p' "$REQ" | head -1); F=$(sed -n 's/^format:[[:space:]]*//p' "$REQ" | head -1); [ -z "$F" ] && F=long
              TARGETS="$TARGETS $E:$F"
            done
          fi
          TARGETS=$(echo $TARGETS); [ -z "$TARGETS" ] && TARGETS="smoke:long"
          for T in $TARGETS; do case "${T%%:*}" in ep-[0-9][0-9][0-9]|smoke) ;; *) echo "bad episode id: $T"; exit 1;; esac; done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          case "$TARGETS" in smoke:*) echo "ep=smoke" >> "$GITHUB_OUTPUT";; *) echo "ep=episodes" >> "$GITHUB_OUTPUT";; esac
          echo "targets: $TARGETS"
      - name: System packages (ffmpeg, espeak-ng, fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core time
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install uv (from PyPI — avoids GitHub API rate limits that broke astral-sh/setup-uv in run 37156263709)
        run: python -m pip install --quiet "uv==0.8.17"
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
      - name: Python deps (pinned)
        run: uv sync --frozen --extra dev
      - name: Chromium for Playwright (runner has none preinstalled for Python)
        if: steps.t.outputs.ep != 'smoke'
        run: uv run playwright install --with-deps chromium
      - name: Cache models
        if: steps.t.outputs.ep != 'smoke'
        uses: actions/cache@v4
        with: { path: models, key: models-kokoro-v1.0-whisper-base-small-dnsmos-v2 }
      - name: Fetch models (GitHub releases, sha256-verified)
        if: steps.t.outputs.ep != 'smoke'
        run: uv run python scripts/fetch_models.py
      - name: Unit tests
        run: uv run pytest -q
      - name: Smoke artifact (delivery-chain test)
        if: steps.t.outputs.ep == 'smoke'
        run: |
          mkdir -p dist/smoke
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac dist/smoke/smoke.mp4
          echo "smoke $(date -u +%FT%TZ) run=${GITHUB_RUN_ID}" > dist/smoke/RELEASE_NOTES.md
          (cd dist/smoke && sha256sum smoke.mp4 RELEASE_NOTES.md > manifest.sha256 && cat manifest.sha256)
      - name: Build episodes
        if: steps.t.outputs.ep != 'smoke'
        run: |
          mkdir -p reports/quota
          for T in ${{ steps.t.outputs.targets }}; do EP=${T%%:*}; FMT=${T##*:}
            /usr/bin/time -v uv run ytf all "$EP" --workers 2 2>&1 | tee build-$EP-long.log
            if [ "$FMT" = "both" ] || [ "$FMT" = "short" ]; then /usr/bin/time -v uv run ytf all "$EP" --format short --workers 2 2>&1 | tee build-$EP-short.log; fi
            { echo "## run ${GITHUB_RUN_ID} $(date -u +%F) $EP"; grep -E "Elapsed|Maximum resident" build-$EP-*.log; du -sh dist/$EP; } > reports/quota/run-${GITHUB_RUN_ID}-$EP.md
          done
      - name: Upload artifact (90-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 90
      - name: Create GitHub Releases (same run; GITHUB_TOKEN)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          for T in ${{ steps.t.outputs.targets }}; do EP=${T%%:*}
            TAG="$EP"; [ "$EP" = smoke ] && TAG="smoke-${GITHUB_RUN_ID}"
            NOTES=dist/$EP/RELEASE_NOTES.md; [ -f "$NOTES" ] || NOTES=/dev/null
            # files only (no directories); the short/ copies of sources.md and licenses.md duplicate the top-level ones
            mapfile -t FILES < <(find "dist/$EP" -type f ! -path "*/short/sources.md" ! -path "*/short/licenses.md" | sort)
            printf '%s\n' "${FILES[@]}"
            if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "${FILES[@]}" --clobber; else gh release create "$TAG" "${FILES[@]}" --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"; fi
          done
