# Render → QC → package → GitHub Release, all in ONE run (GITHUB_TOKEN pushes do not trigger other workflows — ADR-004).
# Triggers: a human/session pushes a tag `ep-NNN` (or `smoke-*` for the delivery-chain test), or workflow_dispatch once this file is on the default branch.
# Free standard runner only (ADR-003). Runner setup is explicit — nothing from the Claude environment is assumed (ADR-005).
name: build-and-release
on:
  push:
    tags: ["ep-*", "smoke-*"]
  workflow_dispatch:
    inputs:
      episode: { description: "episode id (e.g. ep-001) or 'smoke'", required: true, default: "smoke" }
      format: { description: "long | short | both", required: false, default: "long" }
permissions:
  contents: read
concurrency: { group: release-${{ github.ref }}, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # only this job creates the release
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target
        id: t
        run: |
          REF="${GITHUB_REF_NAME}"
          EP="${{ github.event.inputs.episode }}"; FMT="${{ github.event.inputs.format }}"
          if [ -z "$EP" ]; then case "$REF" in smoke-*) EP=smoke;; *) EP="$REF";; esac; fi
          [ -z "$FMT" ] && FMT=long
          echo "ep=$EP" >> "$GITHUB_OUTPUT"; echo "fmt=$FMT" >> "$GITHUB_OUTPUT"
          echo "tag=${REF:-manual-$EP-${GITHUB_RUN_ID}}" >> "$GITHUB_OUTPUT"
      - name: System packages (ffmpeg, espeak-ng, fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core time
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v5
      - name: Python deps (pinned)
        run: uv sync --frozen --extra dev
      - name: Chromium for Playwright (runner has none preinstalled for Python)
        if: steps.t.outputs.ep != 'smoke'
        run: uv run playwright install --with-deps chromium
      - name: Cache models
        if: steps.t.outputs.ep != 'smoke'
        uses: actions/cache@v4
        with: { path: models, key: models-kokoro-v1.0-whisper-base.en-v1 }
      - name: Fetch models (GitHub releases, sha256-verified)
        if: steps.t.outputs.ep != 'smoke'
        run: uv run python scripts/fetch_models.py
      - name: Unit tests
        run: uv run pytest -q
      - name: Smoke artifact (delivery-chain test)
        if: steps.t.outputs.ep == 'smoke'
        run: |
          mkdir -p dist/smoke
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac dist/smoke/smoke.mp4
          echo "smoke $(date -u +%FT%TZ) run=${GITHUB_RUN_ID}" > dist/smoke/RELEASE_NOTES.md
          (cd dist/smoke && sha256sum smoke.mp4 RELEASE_NOTES.md > manifest.sha256 && cat manifest.sha256)
      - name: Build episode
        if: steps.t.outputs.ep != 'smoke'
        run: |
          EP=${{ steps.t.outputs.ep }}; FMT=${{ steps.t.outputs.fmt }}
          /usr/bin/time -v uv run ytf all "$EP" --workers 2 2>&1 | tee build-long.log
          if [ "$FMT" = "both" ] || [ "$FMT" = "short" ]; then /usr/bin/time -v uv run ytf all "$EP" --format short --workers 2 2>&1 | tee build-short.log; fi
          mkdir -p reports/quota && { echo "## run ${GITHUB_RUN_ID} $(date -u +%F) $EP"; grep -E "Elapsed|Maximum resident" build-*.log; du -sh dist/$EP; } > reports/quota/run-${GITHUB_RUN_ID}.md
      - name: Upload artifact (90-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.t.outputs.ep }}-${{ github.run_id }}
          path: dist/${{ steps.t.outputs.ep }}
          retention-days: 90
      - name: Create GitHub Release (same run; GITHUB_TOKEN)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          EP=${{ steps.t.outputs.ep }}; TAG=${{ steps.t.outputs.tag }}
          NOTES=dist/$EP/RELEASE_NOTES.md; [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" dist/$EP/* --clobber; else gh release create "$TAG" dist/$EP/* --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"; fi
