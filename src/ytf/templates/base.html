<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("__FONT_URL__") format("truetype");font-weight:100 900;}
:root{--bg:#0B1020;--paper:#F4F1EA;--amber:#F2A93B;--sky:#5CC8FF;--coral:#FF6B6B;--muted:#8A93A6;--grid:#243049;--w:__W__px;--h:__H__px;}
html,body{margin:0;padding:0;background:var(--bg);width:var(--w);height:var(--h);overflow:hidden;font-family:"Inter","DejaVu Sans",sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;}
#stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;}
#fade{position:absolute;inset:0;background:var(--bg);pointer-events:none;}
.abs{position:absolute;}
.hl{color:var(--amber);}
.muted{color:var(--muted);}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.caption{position:absolute;left:5%;right:5%;bottom:5%;text-align:center;font-size:34px;line-height:1.3;color:var(--paper);text-shadow:0 2px 12px rgba(0,0,0,.6);}
.source{position:absolute;right:2.5%;bottom:1.8%;font-size:20px;color:var(--muted);}
.badge{position:absolute;left:2.5%;top:2.5%;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.title{position:absolute;left:8%;right:8%;top:30%;font-weight:800;font-size:92px;line-height:1.08;letter-spacing:-.02em;}
.subtitle{position:absolute;left:8%;right:8%;top:62%;font-weight:400;font-size:40px;color:var(--muted);line-height:1.3;}
.card{position:absolute;left:10%;right:10%;top:50%;transform:translateY(-50%);text-align:center;}
.card .big{font-weight:800;font-size:220px;line-height:1;letter-spacing:-.04em;}
.card .head{font-weight:700;font-size:64px;line-height:1.15;}
.card .sub{font-size:36px;color:var(--muted);margin-top:28px;line-height:1.35;}
.chart-title{position:absolute;left:5%;top:4.5%;font-weight:700;font-size:44px;line-height:1.15;}
.chart-sub{position:absolute;left:5%;top:11.5%;font-size:28px;color:var(--muted);}
svg text{font-family:"Inter","DejaVu Sans",sans-serif;}
.axis text{fill:var(--muted);font-size:22px;}
.axis line,.axis path{stroke:var(--grid);stroke-width:2;}
.legend{position:absolute;right:5%;top:5%;font-size:26px;line-height:1.6;text-align:right;}
.legend span.sw{display:inline-block;width:26px;height:26px;border-radius:5px;vertical-align:-4px;margin-left:12px;}
.vertical .title{font-size:84px;top:14%;}
.vertical .subtitle{top:48%;font-size:40px;}
.vertical .caption{font-size:44px;bottom:10%;}
.vertical .chart-title{font-size:52px;top:7%;left:6%;right:6%;}
.vertical .chart-sub{top:17%;font-size:32px;left:6%;}
.vertical .card .big{font-size:240px;}
.vertical .card .head{font-size:72px;}
.vertical .legend{top:auto;bottom:24%;right:6%;}
#thumb{position:absolute;inset:0;display:none;}
#thumb .box{position:absolute;left:5%;bottom:8%;right:5%;}
#thumb .headline{font-weight:900;font-size:150px;line-height:.98;letter-spacing:-.035em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.85);}
#thumb .headline em{font-style:normal;color:var(--amber);}
#thumb .sub{font-weight:700;font-size:56px;color:var(--paper);margin-top:18px;text-shadow:0 4px 20px rgba(0,0,0,.8);}
#thumb .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,0) 35%,rgba(11,16,32,.85) 100%);}
</style></head>
<body><div id="stage"></div><div id="thumb"><div class="shade"></div><div class="box"><div class="headline"></div><div class="sub"></div></div></div><div id="fade"></div>
<script>window.EPISODE = __PAYLOAD__;</script>
<script src="__SCENES_JS__"></script>
</body></html>
