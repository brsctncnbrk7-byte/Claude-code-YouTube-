    sub: Golden Square, Soho · September 2, 1854
    color: '#FF6B6B'
  narration: On the second of September, 1854, one hundred and twenty-seven people died of cholera within a few streets of each other in Soho, London. Most of them had fallen ill the day before. Nobody knew what cholera was.
  min_duration: 6
- id: title
  kind: title
  shows: Title card.
  params:
    title: '**616** Dots'
    subtitle: How a map, a table and a pump handle found the source of cholera
  narration: This is the story of how a doctor found the source of an epidemic with a table, a map, and a question nobody else was asking.
  min_duration: 5
- id: daily
  kind: bars
  shows: 'Snow''s own daily tally: deaths per day from August 19 to early October; the spike on September 1–2 and the decline before September 8.'
  params:
    title: Deaths per day, Golden Square outbreak
    subtitle: Snow's table, 1855 · August 19 – September 30, 1854
    data: snow
    series:
    - deaths
    labels:
    - deaths
    colors:
    - '#FF6B6B'
    xkey: date
    xevery: 4
    ylabel: deaths
    reveal_seconds: 8
    chapter: The daily tally
  source: 'Data: Snow (1855) via HistData'
  narration: John Snow was a physician who had argued, five years earlier, that cholera spread through water, not through bad air. When the outbreak began at the end of August he went to the General Register Office and copied out the deaths, day by day. Here is his table. Almost nothing until August thirty-first. Then, in three days, hundreds. By the end of September the tally reached six hundred and sixteen.
  min_duration: 14
- id: dots616
  kind: dots
  shows: Each death as one dot, filling in day by day; the final count 616 appears as the grid completes.
  params:
    title: Six hundred and sixteen
    subtitle: one dot per death · in the order Snow recorded them
    data: snow
    count_key: deaths
    label_key: date
    unit: deaths
    color: '#FF6B6B'
    reveal_seconds: 9
    highlight_from: 20
    chapter: '616'
  source: 'Data: Snow (1855)'
  narration: 'Six hundred and sixteen people. Snow walked the streets with a map and marked each death at the address where it happened. The marks piled up around one place: the public water pump on Broad Street. Streets a few minutes away, served by other pumps, were almost untouched.'
  min_duration: 12
- id: argument
  kind: text
  shows: 'The spatial argument stated: deaths clustered around the Broad Street pump; nearby workhouse and brewery with their own water had few deaths.'
  params:
    headline: The argument was **where**, not just how many
    sub: 'A workhouse with its own well: few deaths. A brewery whose workers drank beer: none reported. Houses nearest the pump: the most.'
    chapter: The map
  narration: The map made an argument. A workhouse near the pump had its own well, and few of its five hundred residents died. A brewery on Broad Street gave its workers beer and had its own water; the owner reported no cases among them. The houses that drew water from the pump suffered worst. The pattern followed the water, not the air.
  min_duration: 10
- id: handle
  kind: line
  shows: 'Attacks and deaths per day with the September 8 handle-removal marker: the curve was already falling.'
  params:
    title: The handle comes off
    subtitle: 'new cases and deaths per day · marker: pump handle removed, September 8'
    data: snow
    series:
    - attacks
    - deaths
    labels:
    - new cases
    - deaths
    colors:
    - '#5CC8FF'
    - '#FF6B6B'
    xkey: date
    xevery: 4
    ylabel: people per day
    markers:
    - x: 20
      label: 'Sept 8: handle removed'
      at: 3.0
    reveal_seconds: 6
    chapter: September 8
  source: 'Data: Snow (1855) via HistData'
  narration: On the evening of September seventh Snow presented his evidence to the parish Board of Guardians. The next day the pump handle was removed. Here is the part the legend leaves out. Look at the curve. New cases had peaked on September first. By the eighth, deaths had already fallen from one hundred and twenty-seven a day to thirty. The outbreak was ending on its own, partly because so many people had fled.
  min_duration: 14
- id: whitehead
  kind: text
  shows: 'Why the case still matters: Whitehead''s independent re-investigation and the index case next to the pump.'
  params:
    headline: The sceptic who confirmed it
    sub: 'Reverend Henry Whitehead set out to disprove Snow, re-interviewed the parish, and found the first case: a cesspit beside the pump.'
    chapter: Whitehead
  narration: 'So did the handle matter? It almost certainly prevented a second wave, and it mattered for another reason. A local curate, Henry Whitehead, did not believe Snow. He set out to disprove him by re-interviewing the parish, house by house. Instead he found the first case: an infant whose washing water had been emptied into a cesspit a few feet from the pump''s well.'
  min_duration: 11
- id: lesson
  kind: text
  shows: 'Thesis: the combination of time series, place, and a comparison group — epidemiology before germ theory.'
  params:
    headline: Time, place, and a **comparison**
    sub: Snow had no microscope. He had a daily count, a map, and people who did not drink the water.
  narration: 'Snow never saw the bacterium. It would be identified decades later. What he had was a count over time, a map over space, and comparison groups: the workhouse, the brewery, the people who drank elsewhere. That is still how outbreaks are traced.'
  min_duration: 8
- id: outro
  kind: outro
  shows: Closing card.
  params:
    headline: Plotted Past
    sub: Every episode, a real mystery solved by a chart. Sources and data in the description.
  narration: 'Snow''s table and the sources for this episode are in the description. Next time: the bombers that came back, and the holes that were not there.'
  min_duration: 6
