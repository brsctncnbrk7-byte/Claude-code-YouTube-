id: ep-003
title: '616 Dots: How a Map Found the Source of Cholera'
thesis: John Snow's 1854 Broad Street investigation combined a daily tally of deaths with a spatial argument about one water pump. The handle came off on September 8, when the outbreak was already fading — and that nuance is part of why the case is so instructive.
format: long
language: en-us
