publish_at_utc: ''
description: 'In late August 1854 cholera erupted around Broad Street in Soho, London. Within days hundreds were dead. John Snow counted the deaths day by day, mapped where they lived, and argued that one water pump was the source — years before germ theory. We rebuild his daily table and the famous pump-handle moment, including the part the legend usually leaves out: the epidemic was already in retreat when the handle came off.'
