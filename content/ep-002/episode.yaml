id: ep-002
title: The Scatterplot That Could Have Saved Challenger
thesis: The night before the 1986 Challenger launch, engineers had O-ring damage data for 23 flights. The chart they built left out the flights with no damage — and with them, the pattern. Plot all 23 and the risk at freezing is unmistakable.
format: long
language: en-us
voice: af_heart
speed: 1.0
playlist: Disasters & Engineering
tags:
