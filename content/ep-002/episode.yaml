scenes:
- id: hook
  kind: text
  shows: The time to failure, as the single number that opens the story.
  params:
    number: 73
    headline: seconds
    sub: Space Shuttle Challenger · January 28, 1986
    color: '#FF6B6B'
  narration: Seventy-three seconds after launch, on January 28, 1986, the Space Shuttle Challenger broke apart. Seven people died. The night before, a group of engineers had tried to stop the launch with a chart.
  min_duration: 6
- id: title
  kind: title
  shows: Title card.
  params:
    title: The Scatterplot That Could Have **Saved** Challenger
    subtitle: 23 flights, two charts, one missing pattern
  narration: This is the story of the chart they drew, the chart they could have drawn, and the difference between them.
  min_duration: 5
- id: engineers
  kind: scatter
  shows: 'The engineers'' view: only the seven flights with O-ring damage, plotted against temperature — no obvious trend.'
  params:
    data: orings
    x: temperature
    y: damaged
    xdomain: &id001
    - 25
    - 85
    ydomain: &id002
    - 0
    - 6.5
    xlabel: Launch temperature (°F)
    ylabel: Damaged O-rings (of 6)
    jitter: true
    title: 'What the engineers plotted: flights **with** O-ring damage'
    subtitle: 7 of 23 flights · damaged primary O-rings vs launch temperature
    hide_if: r.damaged===0
    reveal_seconds: 3
    chapter: The engineers' chart
  source: 'Data: Rogers Commission (1986) via openintro'
  narration: 'On the evening of January 27, engineers at Morton Thiokol, the contractor that built the solid rocket boosters, joined a teleconference with NASA. Their concern was the rubber O-rings that sealed the booster joints. Cold makes rubber stiff. Here is the kind of evidence they had: every flight on which an O-ring had shown damage, plotted against the temperature at launch. Seven flights. The coldest, at fifty-three degrees, had the most damage. The rest scatter from the high fifties to seventy-five. Managers looked at this and saw no clear trend.'
  min_duration: 14
- id: compare
  kind: compare
  shows: 'Side by side: the damaged-only view versus all 23 flights; the zeros cluster at warm temperatures and reveal the slope.'
  params:
    title: Add the flights with **no** damage
    subtitle: 'left: 7 damaged flights · right: all 23 flights'
    right_at: 3.0
    left:
      data: orings
      x: temperature
      y: damaged
      xdomain: *id001
      ydomain: *id002
      xlabel: Launch temperature (°F)
      ylabel: Damaged O-rings (of 6)
      jitter: true
      title: Damaged flights only
      hide_if: r.damaged===0
      left_pad: 0.09
    right:
      data: orings
      x: temperature
      y: damaged
      xdomain: *id001
      ydomain: *id002
      xlabel: Launch temperature (°F)
      ylabel: Damaged O-rings (of 6)
      jitter: true
      title: All 23 flights
      highlight: r.damaged===0
      left_pad: 0.09
  source: 'Data: Rogers Commission (1986) via openintro'
  narration: 'Now add what was left out. Sixteen flights had launched with no O-ring damage at all. Every one of them was warm: sixty-six degrees or higher. Put the zeros back and the picture changes. Damage is not random. It lives at the cold end.'
  min_duration: 12
