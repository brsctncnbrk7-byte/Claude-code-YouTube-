- engineering ethics
ad_suitability_note: Historical disaster with loss of life; no footage, no graphic description; focus on data and decision-making.
audience_made_for_kids: false
publish_at_utc: ''
description: On January 27, 1986, engineers argued by teleconference that Challenger should not launch below 53°F. The chart they had showed seven flights with O-ring damage and no clear trend. It omitted sixteen flights with zero damage. We rebuild both charts from the 23-flight record, fit the simple model statisticians later fitted, and show what the data said about launching at freezing temperatures.
