      at: 9.0
    chapter: All 23 flights
  source: 'Data: Rogers Commission (1986); fit: this episode'
  narration: 'Statisticians later fitted a simple model to these twenty-three flights: the chance that an O-ring is damaged as a function of temperature. Fit the same model to the public table, and the curve climbs steeply below sixty degrees. At fifty-three degrees, the coldest launch so far, it expects about three damaged rings out of six. At the thirty-six degrees recorded on the pad that morning, it expects nearly all six. The engineers'' recommendation that night was to not launch below fifty-three degrees.'
  min_duration: 16
- id: caucus
  kind: text
  shows: 'The decision: engineers'' recommendation, a thirty-minute offline caucus, management reversal.'
  params:
    headline: A thirty-minute **caucus**
    sub: 'Thiokol engineers: do not launch below 53°F. Management took the call offline, reversed the recommendation, and signed off.'
    chapter: The decision
  narration: NASA managers pushed back on the recommendation. Thiokol's management took the call offline for about thirty minutes, returned, and overruled its own engineers. The launch went ahead. The Presidential Commission later traced the failure to the O-ring seal in the aft field joint of the right solid rocket booster, with cold temperature among the causes.
  min_duration: 10
- id: selection
  kind: text
  shows: 'The statistical lesson named: selecting on the outcome removes the comparison group.'
  params:
    headline: Selecting on the **outcome**
    sub: If you only plot the cases where something went wrong, you cannot see what made it go wrong.
  narration: 'The mistake has a name. The engineers selected on the outcome: they plotted only the flights where damage had occurred. That throws away the comparison group. Without the flights that went fine, there is nothing for the damaged flights to be different from.'
  min_duration: 8
- id: tufte
  kind: text
  shows: 'The later analyses: Dalal, Fowlkes and Hoadley (1989) and Tufte (1997) argued the data were sufficient.'
  params:
    headline: The chart that could have been drawn
    sub: 'Dalal, Fowlkes & Hoadley (1989): the pre-launch data predicted very high failure risk near freezing. Tufte (1997): the evidence was there; the display failed.'
  narration: 'In 1989, three statisticians published a risk analysis using only the data available before the launch. Their conclusion was that the probability of failure near freezing was very high. Edward Tufte later made the same point about the charts themselves: the evidence existed; the display failed to show it.'
  min_duration: 9
- id: why
  kind: text
  shows: Thesis restated.
  params:
    headline: The data were **not** the problem.
    sub: Twenty-three rows, two columns. Shown whole, they told the truth.
  narration: Twenty-three rows and two columns. Shown in full, they told the truth. Shown in part, they said nothing at all.
  min_duration: 6
- id: outro
  kind: outro
  shows: Closing card.
  params:
