id: ep-001
title: "The Chart That Shamed an Army: Florence Nightingale's Rose"
thesis: "Nightingale's 1858 polar-area diagram showed that most British soldiers in the Crimean War died of preventable disease, not wounds — and the shape of the chart, not the table, carried the argument to the people who could act."
format: long
language: en-us
voice: af_heart
speed: 1.0
playlist: "Epidemics & Medicine"
tags: [data visualization, Florence Nightingale, Crimean War, statistics, history of science, charts, epidemiology]
ad_suitability_note: "Historical mortality statistics; no graphic imagery; measured language about disease and death."
audience_made_for_kids: false
publish_at_utc: ""
description: |
  In January 1855 the British army in the Crimea was dying at a rate of 1,023 men per 1,000 per year — almost all of it from disease, not combat. Florence Nightingale turned that ledger into a chart that Parliament could not ignore. In this episode we rebuild her 1858 polar-area diagram from her own monthly numbers, see why her first attempt misled the eye, and follow what the chart changed.
