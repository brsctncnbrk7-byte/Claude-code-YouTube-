scenes:
  - id: hook
    kind: text
    shows: "The single most alarming number in the dataset: the annualized death rate from disease in January 1855."
    params: { number: 1023, headline: "deaths per 1,000 soldiers, per year", sub: "British Army in the East · January 1855 · disease only", color: "#FF6B6B" }
    narration: >-
      In January 1855, the British army besieging Sevastopol was dying at a rate of one thousand and twenty-three men per thousand, per year.
      Read that again. At that rate, disease alone would have wiped out the entire army in under a year, without the enemy firing a shot.
    min_duration: 6
  - id: title
    kind: title
    shows: "Episode title and framing."
    params: { title: "The Chart That **Shamed** an Army", subtitle: "Florence Nightingale's rose, rebuilt from her own numbers" }
    narration: >-
      This is the story of how one woman turned that ledger into a picture, and why the picture worked where the numbers had failed.
    min_duration: 5
  - id: bars_all
    kind: bars
    shows: "Monthly deaths by cause for the whole war, stacked; disease dwarfs wounds in every month of the first year."
    params:
      title: "Deaths in the British Army in the East, by month"
      subtitle: "April 1854 – March 1856 · Nightingale's table, 1858"
      data: nightingale
      series: [Disease, Wounds, Other]
      labels: ["Disease (preventable)", "Wounds", "Other causes"]
      colors: ["#5CC8FF", "#FF6B6B", "#F4F1EA"]
      xkey: Month
      xevery: 2
      ylabel: "deaths per month"
      chapter: "Two years of deaths"
    source: "Data: Nightingale (1858), via HistData"
    narration: >-
      Here is every month of the war, from April 1854 to March 1856. Blue is death from disease: cholera, typhus, dysentery.
      Red is death from wounds. White is everything else. The bars are not close.
      Over the whole war, disease killed fourteen thousand four hundred and seventy-six British soldiers. Wounds killed one thousand seven hundred and fifty-eight.
      For every soldier killed by the enemy, eight died of something that could have been prevented.
    min_duration: 10
  - id: ledger
    kind: text
    shows: "Where the numbers came from and why counting itself was the first problem."
    params: { headline: "Three columns in a ledger", sub: "**Zymotic** disease · Wounds and injuries · All other causes — William Farr's classification, adopted by Nightingale" }
    narration: >-
      The numbers came from army returns, compiled with William Farr, the statistician at the General Register Office.
      Florence Nightingale reached the barracks hospital at Scutari in November 1854 and found the record keeping in disarray.
      She sorted every death into three columns: zymotic disease, meaning epidemic and preventable; wounds; and everything else.
      Counting came before cleaning.
    min_duration: 8
  - id: rose_y1
    kind: rose
    shows: "The famous polar-area diagram, year one: wedge area proportional to deaths; the January 1855 disease wedge dominates."
    params:
      title: "Diagram of the Causes of Mortality in the Army in the East"
      subtitle: "April 1854 – March 1855 · area of each wedge ∝ deaths"
      data: nightingale
      filter: "r.Year===1854 || (r.Year===1855 && ['Jan','Feb','Mar'].includes(r.Month))"
      series: [Disease, Wounds, Other]
      labels: ["Disease", "Wounds", "Other"]
      colors: ["#5CC8FF", "#FF6B6B", "#F4F1EA"]
      xkey: Month
      vmax: 2761
      reveal_seconds: 9
      chapter: "The rose, year one"
    source: "Redrawn from Nightingale (1858)"
    narration: >-
      In 1858 she drew this. Twelve wedges, one per month, starting in April 1854 and running clockwise.
      The area of each wedge, not its length, is proportional to the number of deaths. Blue is preventable disease. Red is wounds. White is other causes.
      Watch what happens as winter arrives. Watch January.
    min_duration: 12
  - id: rose_y2
    kind: rose
    shows: "Year two at the same scale: wedges shrink after the Sanitary Commission's work; by autumn 1855 wounds exceed disease."
    params:
      title: "The second year, at the same scale"
      subtitle: "April 1855 – March 1856 · Sanitary Commission at Scutari from March 1855"
      data: nightingale
      filter: "r.Year===1856 || (r.Year===1855 && !['Jan','Feb','Mar'].includes(r.Month))"
      series: [Disease, Wounds, Other]
      labels: ["Disease", "Wounds", "Other"]
      colors: ["#5CC8FF", "#FF6B6B", "#F4F1EA"]
      xkey: Month
      vmax: 2761
      reveal_seconds: 8
      chapter: "The rose, year two"
    source: "Redrawn from Nightingale (1858)"
    narration: >-
      Now the second year, drawn at exactly the same scale.
      In March 1855 a Sanitary Commission reached Scutari. It flushed the sewers, cleared the latrines, and, by one widely repeated account, removed a dead horse from the water supply.
      The wedges shrink. By September 1855, for the first time, more soldiers died of wounds than of disease.
    min_duration: 11
  - id: army_size
    kind: line
    shows: "The army in the East grew more than fivefold over the war; raw death counts therefore need to be read as rates."
    params:
      title: "The army kept growing"
      subtitle: "Average strength of the British Army in the East, by month"
      data: nightingale
      series: [Army]
      labels: ["Army strength"]
      colors: ["#F2A93B"]
      xkey: Month
      xevery: 2
      ylabel: "soldiers"
      reveal_seconds: 5
      chapter: "A growing army"
    source: "Data: Nightingale (1858), via HistData"
    narration: >-
      One more thing the table shows. The army itself was changing. In April 1854 there were about eight and a half thousand British soldiers in the East.
      By March 1856 there were more than forty-six thousand. A death count in a small army and a death count in a large one are not the same thing, which is why Nightingale, following Farr, reported deaths as annual rates per thousand.
    min_duration: 10
  - id: rates
    kind: line
    shows: "Annualized death rates per 1,000 remove the effect of the growing army: disease falls from over 1,000 to under 4."
    params:
      title: "Annual death rate per 1,000 soldiers"
      subtitle: "Army size removed · disease vs wounds"
      data: nightingale
      series: [Disease.rate, Wounds.rate]
      labels: ["Disease", "Wounds"]
      colors: ["#5CC8FF", "#FF6B6B"]
      xkey: Month
      xevery: 2
      ylabel: "deaths per 1,000 per year"
      markers:
        - { x: 7, label: "Nightingale arrives", at: 2.5 }
        - { x: 11, label: "Sanitary Commission", at: 4.5 }
      reveal_seconds: 7
      chapter: "Rates, not counts"
    source: "Data: Nightingale (1858), via HistData"
    narration: >-
      Rates tell the same story with the army's size taken out. The army more than doubled during the war, so raw counts can mislead.
      Per thousand men, disease deaths fell from over one thousand a year in January 1855 to under four by March 1856.
    min_duration: 9
  - id: batswing
    kind: text
    shows: "Her first diagram encoded mortality in the radius, which exaggerates differences; she redrew it with area carrying the number."
    params: { headline: "The false start: the **bat's wing**", sub: "Radius ∝ deaths makes 2× look like 4×. The 1858 version writes the rule into its legend: areas 'are each measured from the centre as the common vertex.'" }
    narration: >-
      Her first attempt, later nicknamed the bat's wing, scaled the radius of each wedge to the death rate.
      That exaggerates: double the deaths looks like four times the area. She redrew it so that the area of each wedge carried the number, and wrote the rule into the legend itself.
    min_duration: 8
  - id: coxcomb
    kind: text
    shows: "A naming correction supported by historian Hugh Small: 'coxcomb' referred to the booklet, not the chart."
    params: { headline: "It is not a **coxcomb**", sub: "Historian Hugh Small argues Nightingale used that word for the printed booklet of diagrams, not for this chart." }
    narration: >-
      Most people call the chart a coxcomb. According to historian Hugh Small, she used that word for the printed booklet the diagrams appeared in, not for the chart itself.
    min_duration: 6
  - id: barracks
    kind: bars
    shows: "Her follow-up 'Lines' chart: peacetime soldiers in English barracks died at nearly twice the rate of civilian men of the same ages."
    params:
      title: "Peacetime, at home: soldiers vs civilians"
      subtitle: "Annual deaths per 1,000 men of military age · Nightingale, Mortality of the British Army (1858)"
      data: barracks
      series: [rate]
      labels: ["deaths per 1,000 per year"]
      colors: ["#F2A93B"]
      xkey: group
      ymax: 24
      ylabel: "deaths per 1,000 per year"
      reveal_seconds: 3
      chapter: "The second chart"
    source: "Figures as reported by Nightingale (1858); via Small (1998), Scientific American (2020)"
    narration: >-
      She did not stop at the war. Back in England she compared young soldiers living in barracks with civilian men of the same ages.
      Civilians died at about eleven per thousand a year. Infantry, seventeen. Artillery, nineteen. Guards, twenty.
      Healthy men, already screened by a medical exam, were dying at nearly twice the civilian rate in peacetime. She printed two thousand copies of the report at her own expense and sent them to people who could act.
    min_duration: 12
  - id: impact
    kind: text
    shows: "What the chart changed: the Royal Commission (1857), reforms, and her election to the Statistical Society (1858)."
    params: { headline: "What a shape can do", sub: "Royal Commission on the Health of the Army, 1857 · first woman elected to the Statistical Society of London, 1858 · Army Medical School at Chatham (1859–60)", chapter: "What it changed" }
    narration: >-
      The diagram went into her evidence for the Royal Commission on the Health of the Army, formed in 1857, and to the people who could act: Queen Victoria, Sidney Herbert, members of Parliament.
      Reforms followed: an army medical school, routine sanitary statistics for barracks and hospitals.
      In 1858 she became the first woman elected to the Statistical Society of London.
    min_duration: 9
  - id: why
    kind: text
    shows: "The episode's thesis: the chart carried one argument that a table could not."
    params: { headline: "The table had the facts. The chart had the **argument**.", sub: "The biggest killer was the one you could fix." }
    narration: >-
      The report had hundreds of pages of tables. The chart made one argument, and made it in a shape: the biggest killer was the one you could fix.
    min_duration: 6
  - id: outro
    kind: outro
    shows: "Closing card; sources pointer."
    params: { headline: "Plotted Past", sub: "Every episode, a real mystery solved by a chart. Sources and data in the description." }
    narration: >-
      Next time: the scatterplot that could have saved the space shuttle Challenger. Sources and the data for this episode are in the description.
    min_duration: 6
