scenes:
- id: hook
  kind: text
  shows: The starting strength as the hook number.
  params:
    number: 422000
    headline: soldiers crossed the Niemen, June 1812
    sub: Napoleon's Grande Armée · Minard's figure
    color: '#F2A93B'
  narration: In June 1812, four hundred and twenty-two thousand soldiers crossed the river Niemen into Russia. Six months later, about ten thousand came back. In 1869 a retired engineer drew that fact as a single line.
  min_duration: 7
- id: title
  kind: title
  shows: Title.
  params:
    title: Napoleon's Army in **One Line**
    subtitle: Minard's 1869 map, rebuilt from his own numbers
  narration: This is the story of the chart many people call the best ever drawn, and what it leaves out.
  min_duration: 5
- id: flow_adv
  kind: flow
  shows: The advance band thinning from Kowno to Moscow; width proportional to men.
  params:
    data: troops
    x: long
    y: lat
    size: survivors
    group: group
    direction: direction
    cities_data: cities
    vmax: 340000
    title: 'The advance: Kowno to Moscow'
    subtitle: band width ∝ number of men · amber = advance
    reveal_seconds: 9
    chapter: The advance
    only: A
  source: 'Data: Minard (1869) via HistData'
  narration: 'Charles Joseph [[Minard|Mee-nar]] was a civil engineer who spent his retirement drawing flows: of coal, of wine, of people. Here the flow is an army. The band starts at the Polish border, thick with three hundred and forty thousand men in the main column, and it thins as the army marches east. Smaller columns split off to the north. Men die of heat, hunger and disease long before the first great battle. By Moscow, the band is a fraction of its width.'
  min_duration: 14
- id: flow_full
  kind: flow
  shows: Advance and retreat together with the temperature strip; the retreat band collapses as temperatures fall.
  params:
    data: troops
    x: long
    y: lat
    size: survivors
    group: group
    direction: direction
    cities_data: cities
    temp_data: temp
    temp_x: long
    temp_y: temp
    temp_label: date
    vmax: 340000
    title: The retreat, with the temperature
    subtitle: white = retreat · temperature in degrees Réaumur (−30°R ≈ −37°C)
    reveal_seconds: 12
    chapter: The retreat
  source: 'Data: Minard (1869) via HistData'
  narration: Then the retreat. Minard drew it in a second band beneath the first, and under that a strip of temperatures as the army walked back into winter. Zero degrees [[Réaumur|Ray-oh-mur]] on October eighteenth. Minus twenty-one on November fourteenth. Minus thirty on December sixth, which is close to minus thirty-seven Celsius. Watch the band at the [[Berezina|Berry-zee-na]] river, where the crossing cost thousands in two days. By the time the line reaches the border again, it is a thread.
  min_duration: 16
- id: variables
  kind: text
  shows: 'The encodings named: six variables in one figure.'
  params:
    headline: Six variables, no legend needed
    sub: men · longitude · latitude · direction · date · temperature
    chapter: Why it works
  narration: Count the things this one picture shows. The number of men, in the width of the band. Where they were, in its position. Which way they were going, in its colour. When, in the dates. And how cold it was, in the strip below. Six variables, and you can read it without a legend.
  min_duration: 8
- id: caveat
  kind: text
  shows: 'What the map leaves out: sources of Minard''s figures; Russian losses; it is a graphic, not a census.'
  params:
    headline: What it leaves **out**
    sub: Minard's numbers come from memoirs and dispatches, not a census. The map shows no Russian losses and no civilians.
  narration: It also leaves things out. [[Minard's|Mee-nar's]] numbers came from memoirs and dispatches, assembled decades after the war; they are estimates, not a count. The map shows nothing of Russian losses, or of the civilians along the road. It is an argument about one army, made with one line.
  min_duration: 8
- id: why
  kind: text
  shows: Thesis.
  params:
    headline: A number you can **see**
    sub: 422,000 to 10,000 is a statistic. A band that thins to a thread is an experience.
  narration: Four hundred and twenty-two thousand to ten thousand is a statistic. A band that thins to a thread, in the cold, is something you can feel. That is what the chart does that the number cannot.
  min_duration: 6
- id: outro
  kind: outro
  shows: Closing.
  params:
    headline: Plotted Past
    sub: Every episode, a real mystery solved by a chart. Sources and data in the description.
  narration: 'Minard''s figures and the sources for this episode are in the description. Next time: the poll that got 1936 spectacularly wrong.'
  min_duration: 6
