id: ep-005
title: 'Napoleon''s Army in One Line: Minard''s Map'
thesis: Minard's 1869 flow map encodes army size, position, direction, dates and temperature in a single band; the band thins from 422,000 to 10,000 and makes the catastrophe legible without a single number spoken.
format: long
language: en-us
voice: af_heart
speed: 1.0
playlist: The Birth of Charts
tags:
- Minard
- Napoleon
- '1812'
- data visualization
- flow map
- history of charts
- Russia
ad_suitability_note: Military history and mass death presented as historical statistics; no graphic imagery.
audience_made_for_kids: false
publish_at_utc: ''
description: 'In 1869 a retired French engineer, Charles Joseph Minard, drew the Russian campaign of 1812 as one tapering band: 422,000 men marching east, 10,000 coming back. We rebuild the figure from Minard''s own numbers, segment by segment, with the temperature strip that explains the retreat.'
