id: ep-006
title: The Poll That Got 1936 Spectacularly Wrong
thesis: 'The Literary Digest collected 2.4 million ballots and predicted a Landon landslide; Roosevelt won 46 of 48 states. Sample size is not sample quality: who you ask, and who bothers to answer, decide the result.'
format: long
