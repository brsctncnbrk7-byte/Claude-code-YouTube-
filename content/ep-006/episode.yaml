    - ballots
    colors:
    - '#F2A93B'
    xkey: stage
    ylabel: ballots
    reveal_seconds: 3
    chapter: The mailing
  source: 'Figures: Literary Digest (1936) as reported in Squire (1988)'
  narration: The Literary Digest had called every presidential election since 1916. Its method was scale. It mailed ten million ballots, to names taken from telephone directories, automobile registrations and its own subscriber lists. About twenty-four percent came back. Two point four million is an enormous sample. It was also the wrong one, twice over.
  min_duration: 10
- id: compare_polls
  kind: bars
  shows: 'Predicted vote shares vs the actual result: the Digest''s 57/43 against Gallup''s 44/56 and the real 37.5/62.5.'
  params:
    title: Prediction vs result
    subtitle: share of the two-party vote (%)
    data: polls
    series:
    - landon
    - roosevelt
    labels:
    - Landon
    - Roosevelt
    colors:
    - '#FF6B6B'
    - '#5CC8FF'
    xkey: poll
    ymax: 100
    ylabel: '% of two-party vote'
    reveal_seconds: 4
    chapter: Prediction vs result
  source: 'Digest and Gallup figures via Squire (1988); result: 1936 election returns'
  narration: 'Here are the three numbers side by side. The Digest, with two point four million ballots: Landon fifty-seven. George Gallup, a young pollster with roughly fifty thousand interviews, chosen to mirror the population by region, income and sex: Roosevelt fifty-six. The election: Roosevelt about sixty-two to thirty-eight. The small sample was close. The huge one was off by nineteen points.'
  min_duration: 12
- id: selection
  kind: text
  shows: 'Bias one: the sampling frame (phones, cars, subscriptions) over-represented the better-off in 1936.'
  params:
    headline: 'Bias one: **who was asked**'
    sub: Telephone directories, car registrations, magazine subscribers — in the Depression, a wealthier slice of the country than the electorate.
  narration: The first problem was who received a ballot. In 1936, in the middle of the Depression, owning a telephone or a car marked you as better off than most voters, and better-off voters leaned Republican. The list itself tilted toward Landon.
  min_duration: 8
- id: nonresponse
  kind: text
  shows: 'Bias two: nonresponse — those who mailed back differed from those who did not; later research names this the larger error.'
  params:
    headline: 'Bias two: **who answered**'
    sub: Only 24% replied. Later analysis of a 1937 Gallup survey found that Roosevelt supporters on the list were less likely to mail the ballot back.
  narration: The second problem was who bothered to reply. Only one in four did. In 1937 Gallup asked people whether they had received a Digest ballot and whether they had returned it. Roosevelt supporters on the list had been less likely to send it back. In 1988 the political scientist Peverill Squire re-analysed that survey and concluded that both biases were real, and that the failure to respond was the larger one.
  min_duration: 11
- id: lesson
  kind: text
  shows: 'Thesis: size does not fix bias; a biased sample converges confidently on the wrong answer.'
  params:
    headline: Size does not fix **bias**
    sub: A biased sample does not get more accurate as it grows. It gets more confident.
  narration: This is the lesson that survived. A biased sample does not get more accurate as it grows. It gets more confident. Two point four million ballots gave the Digest a precise estimate of the wrong population.
  min_duration: 7
- id: aftermath
  kind: text
  shows: 'Consequence: the Digest folded within two years; quota and later probability sampling took over.'
  params:
    headline: The aftermath
    sub: The Literary Digest ceased publication in 1938. Gallup's smaller, designed samples became the model — until 1948 taught the next lesson.
    chapter: Aftermath
  narration: The Literary Digest folded within two years. Gallup's approach, small samples designed to look like the country, became the standard. It would fail in its own way in 1948, but that is another episode.
  min_duration: 7
- id: outro
  kind: outro
  shows: Closing.
  params:
