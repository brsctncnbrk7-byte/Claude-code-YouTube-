  params:
    title: The Poll That Got 1936 **Spectacularly** Wrong
    subtitle: Why 2.4 million answers lost to 50,000
  narration: Three weeks later Roosevelt won forty-six of forty-eight states. This is the story of how the biggest poll in history got it backwards, and why a much smaller one got it right.
  min_duration: 6
- id: funnel
  kind: bars
  shows: Ten million ballots mailed; 2.4 million returned — the response rate is the first clue.
  params:
