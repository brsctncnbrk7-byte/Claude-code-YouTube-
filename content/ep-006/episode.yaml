description: In 1936 the Literary Digest mailed ten million ballots, received 2.4 million back, and predicted Alf Landon would beat Franklin Roosevelt 57 to 43. Roosevelt won in a landslide. George Gallup, with about fifty thousand interviews, called it. We rebuild the numbers and show why a huge sample can be worse than a small one.
