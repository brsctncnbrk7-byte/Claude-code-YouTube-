[project]
name = "ytf"
version = "0.1.0"
description = "Plotted Past — free, CPU-only, end-to-end YouTube video production pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "kokoro-onnx==0.6.1",
  "onnxruntime==1.30.0",
  "soundfile==0.14.0",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "playwright==1.56.0",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
  "sherpa-onnx==1.13.8",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
ytf = "ytf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
